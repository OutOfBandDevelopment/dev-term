# Throwaway brokers for dev-term's broker-transport integration tests. See README.md.
# Ports are bound to 127.0.0.1 only; credentials are test-only (devterm/devterm).
name: devterm-test
services:
  mosquitto:
    image: eclipse-mosquitto:2
    ports: ["127.0.0.1:1883:1883"]
    volumes: ["./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro"]
  rabbitmq:
    image: rabbitmq:4-management
    environment:
      RABBITMQ_DEFAULT_USER: devterm
      RABBITMQ_DEFAULT_PASS: devterm
    ports:
      - "127.0.0.1:5672:5672"     # AMQP 0-9-1
      - "127.0.0.1:21613:61613"   # STOMP
      - "127.0.0.1:1884:1883"     # MQTT (plugin)
      - "127.0.0.1:15672:15672"   # management UI
    volumes: ["./rabbitmq/enabled_plugins:/etc/rabbitmq/enabled_plugins:ro"]
  ser2net:
    build: ./ser2net
    ports: ["127.0.0.1:2217:2217"]   # RFC 2217; bytes sent come back (virtual echo port)
  # Not a test dependency: a local OpenTelemetry viewer for `dev-term --otlp true` (see docs/design/observability.md).
  aspire-dashboard:
    image: mcr.microsoft.com/dotnet/aspire-dashboard:9.0
    environment:
      DASHBOARD__FRONTEND__AUTHMODE: Unsecured
      DASHBOARD__OTLP__AUTHMODE: Unsecured
    ports:
      - "127.0.0.1:18888:18888"   # dashboard UI
      - "127.0.0.1:4317:18889"    # OTLP/gRPC
